name: Tracked secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tracked-secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan tracked files
        run: python3 scripts/scan_tracked_secrets.py
